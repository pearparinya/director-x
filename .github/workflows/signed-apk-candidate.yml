name: DIRECTOR X Signed APK Candidate (No Publish)

on:
  push:
    branches:
      - feature/director-x-category-1-script-analysis
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to test (no publication)'
        required: true
        type: choice
        options:
          - feature/shopping-resilience-479
          - feature/director-x-480-continuity
          - feature/director-x-category-1-script-analysis

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    concurrency:
      group: signed-apk-candidate-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release configuration
        run: python3 scripts/check_release_config.py
      - name: Restore and validate existing signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS; do
            test -n "${!var}" || { echo "::error::Missing signing secret: $var"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/director-x-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/director-x-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Existing signing key loaded successfully."
      - name: Build release and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Retry transient Maven Central rate limits, not Kotlin/Gradle compilation errors.
          for attempt in 1 2 3; do
            LOG="$RUNNER_TEMP/director-x-build-attempt-$attempt.log"
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee "$LOG"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq '429|Too Many Requests' "$LOG"; then
              echo "::error::Build failed (not a retryable rate limit, or attempts exhausted)"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Sign, verify and inspect candidate APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          BUILD="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "::error::Missing versionName or versionCode in Gradle config"
            exit 1
          fi
          echo "Candidate version: $VERSION ($BUILD)"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -s "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned release APK missing"
            find app/build/outputs/apk/release -type f -name '*.apk' -print || true
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for tool in apksigner aapt; do
            if [ ! -x "$BUILD_TOOLS/$tool" ]; then
              echo "::error::Android build tool missing: $tool"
              exit 1
            fi
          done
          APK="$RUNNER_TEMP/DIRECTOR-X-$VERSION-candidate.apk"
          echo "Signing release APK..."
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/director-x-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "env:STORE_PASSWORD" --key-pass "env:KEY_PASSWORD" --out "$APK" "$UNSIGNED_APK"
          if [ ! -s "$APK" ]; then
            echo "::error::Signed APK missing after apksigner"
            exit 1
          fi
          echo "Verifying APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-verification.txt" || {
            echo "::error::APK signature verification failed"
            exit 1
          }
          echo "Inspecting APK package metadata..."
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")" || {
            echo "::error::aapt could not inspect signed APK"
            exit 1
          }
          PACKAGE="$(printf '%s\n' "$BADGING" | grep -m1 '^package: ' || true)"
          if [ -z "$PACKAGE" ]; then
            echo "::error::APK package metadata is missing"
            exit 1
          fi
          echo "$PACKAGE"
          EXPECTED_PACKAGE="com.pearparinya.automovie"
          if [[ "$PACKAGE" != *"name='$EXPECTED_PACKAGE'"* ]]; then
            echo "::error::APK package name mismatch"
            exit 1
          fi
          if [[ "$PACKAGE" != *"versionCode='$BUILD'"* ]]; then
            echo "::error::APK versionCode mismatch (expected $BUILD)"
            exit 1
          fi
          if [[ "$PACKAGE" != *"versionName='$VERSION'"* ]]; then
            echo "::error::APK versionName mismatch (expected $VERSION)"
            exit 1
          fi
          # apksigner formats certificate lines differently across build-tools versions.
          # Match both "Signer #1 certificate SHA-256 digest:" and the common
          # "Signer #1 certificate SHA-256 digest: ..." variants with whitespace.
          CERT_DIGEST="$(sed -nE 's/^[[:space:]]*Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/p' "$RUNNER_TEMP/apk-verification.txt" | head -n 1)"
          if [ -z "$CERT_DIGEST" ]; then
            echo "::warning::No SHA-256 digest line in apksigner output; deriving certificate digest from the existing keystore"
            CERT_DIGEST="$(keytool -list -v -keystore "$RUNNER_TEMP/director-x-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([[:xdigit:]:]+).*/\1/p' | head -n 1)"
          fi
          if [ -z "$CERT_DIGEST" ]; then
            echo "::error::Cannot determine signing certificate SHA-256 fingerprint"
            exit 1
          fi
          {
            echo "### Signed candidate APK (not published)"
            echo "- Version: $VERSION (build $BUILD)"
            echo "- Package: $EXPECTED_PACKAGE"
            echo "- SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "- Signing certificate SHA-256: $CERT_DIGEST"
            echo "- No GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"
      - name: Upload candidate for controlled upgrade testing
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTOR-X-SIGNED-CANDIDATE
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 90
