name: DIRECTOR X Release Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

# Only the newest main-branch build may publish the in-app update.
# This prevents an older overlapping run from finishing later and
# incorrectly becoming GitHub's "latest" release.
concurrency:
  group: auto-movie-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # RESTORE PERMANENT RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/director-x-release.jks"

          if [ ! -s "$RUNNER_TEMP/director-x-release.jks" ]; then
            echo "Failed to restore release keystore."
            exit 1
          fi

          echo "Release keystore restored."

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/director-x-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore verified."

      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Check Android project files
        shell: bash
        run: |
          echo "Checking DIRECTOR X project..."

          test -f "settings.gradle.kts" || {
            echo "Missing: settings.gradle.kts"
            exit 1
          }

          test -f "app/build.gradle.kts" || {
            echo "Missing: app/build.gradle.kts"
            exit 1
          }

          test -f "app/src/main/AndroidManifest.xml" || {
            echo "Missing: app/src/main/AndroidManifest.xml"
            find app -maxdepth 4 -type f | sort
            exit 1
          }

          test -f "app/src/main/java/com/pearparinya/automovie/StudioActivity.kt" || {
            echo "Missing: StudioActivity.kt"
            find app/src/main -type f | sort
            exit 1
          }

          echo "DIRECTOR X project files verified."

      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName."
            exit 1
          fi
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [ -n "$VERSION_CODE" ] || { echo "Unable to read versionCode."; exit 1; }
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building DIRECTOR X R$VERSION_NAME • BUILD $VERSION_CODE"

      - name: Build release APK
        shell: bash
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease

      # ============================================================
      # LOCATE UNSIGNED APK
      # ============================================================

      - name: Locate unsigned release APK
        id: locate_apk
        shell: bash
        run: |
          UNSIGNED_APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*unsigned*.apk' \
            | head -n 1)"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "Found: $UNSIGNED_APK"
          echo "unsigned_apk=$UNSIGNED_APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SIGN WITH PERMANENT KEY
      # ============================================================

      - name: Sign release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UNSIGNED_APK: ${{ steps.locate_apk.outputs.unsigned_apk }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          SIGNED_APK="$RUNNER_TEMP/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/director-x-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          test -s "$SIGNED_APK" || {
            echo "Signed APK was not created."
            exit 1
          }

          echo "DIRECTOR X R${{ steps.app_version.outputs.version }} APK signed."

      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk"

          echo "DIRECTOR X R${{ steps.app_version.outputs.version }} signature verified."

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTOR-X-${{ steps.app_version.outputs.version }}-SIGNED-APK
          path: ${{ runner.temp }}/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # PUBLISH IMMUTABLE BUILD RELEASE FOR IN-APP UPDATE
      # Each build gets its own tag/asset. This avoids stale asset IDs
      # from repeatedly replacing the R6.24 release asset.
      # ============================================================

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD="${{ steps.app_version.outputs.build }}"
          TAG="R${VERSION}-B${BUILD}"
          APK="$RUNNER_TEMP/DIRECTOR-X-${VERSION}-release.apk"
          ASSET_NAME="DIRECTOR-X-${VERSION}.apk"
          PUBLISH_APK="$RUNNER_TEMP/$ASSET_NAME"

          cp "$APK" "$PUBLISH_APK"

          # Refuse to overwrite an existing release or tag. Each build is immutable.
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release or tag $TAG already exists; increase the app version."
            exit 1
          fi

          gh release create "$TAG" "$PUBLISH_APK" \
            --target "${{ github.sha }}" \
            --title "DIRECTOR X ${VERSION}" \
            --notes "DIRECTOR X ${VERSION} — อัปเดตภายในแอปได้โดยตรง" \
            --latest

          echo "Verifying published build release..."
          ACTUAL_BODY="$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" --jq '.body')"
          ACTUAL_ASSET="$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name == "'"$ASSET_NAME"'") | .name' | head -n 1)"

          echo "$ACTUAL_BODY" | grep -q "DIRECTOR X ${VERSION}" || {
            echo "Release verification failed: BUILD metadata is not current."
            exit 1
          }

          [ "$ACTUAL_ASSET" = "$ASSET_NAME" ] || {
            echo "Release verification failed: APK asset is missing."
            exit 1
          }

          echo "Published and verified $TAG • $ASSET_NAME."

