name: DIRECTOR X Release Signed APK
# Release trigger verification for Director X 5.09 Build 1125 (manual approval 2026-11-19).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

# Only the newest main-branch build may publish the in-app update.
# This prevents an older overlapping run from finishing later and
# incorrectly becoming GitHub's "latest" release.
concurrency:
  group: auto-movie-release-main
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Skip already-published version before building
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          BUILD="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "Missing Android version metadata."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || ! [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionName/versionCode format."
            exit 1
          fi
          TAG="R${VERSION}-B${BUILD}"
          echo "Checking immutable release: $TAG"

          # Fail closed on API errors. A 403/rate-limit must never look like
          # a missing release and accidentally trigger another signed build.
          API_STATUS="$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>&1)" && API_EXIT=0 || API_EXIT=$?
          if [ "$API_EXIT" -eq 0 ]; then
            echo "Release $TAG already exists; skipping duplicate build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped duplicate release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$API_STATUS" | grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404'; then
            # A tag may exist without a GitHub Release. Never overwrite it.
            if ! REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$TAG")"; then
              echo "::error::Could not check remote tags; refusing to build."
              exit 1
            fi
            if [ -n "$REMOTE_TAGS" ]; then
              echo "::error::Tag $TAG exists without a published Release. Resolve manually."
              exit 1
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "### New release candidate: $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not verify release status for $TAG; refusing to build."
            echo "$API_STATUS" | tail -n 12
            exit 1
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate release configuration before signing
        run: python3 scripts/check_release_config.py

      # ============================================================
      # RESTORE PERMANENT RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/director-x-release.jks"

          if [ ! -s "$RUNNER_TEMP/director-x-release.jks" ]; then
            echo "Failed to restore release keystore."
            exit 1
          fi

          echo "Release keystore restored."

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/director-x-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore verified."

      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Check Android project files
        shell: bash
        run: |
          echo "Checking DIRECTOR X project..."

          test -f "settings.gradle.kts" || {
            echo "Missing: settings.gradle.kts"
            exit 1
          }

          test -f "app/build.gradle.kts" || {
            echo "Missing: app/build.gradle.kts"
            exit 1
          }

          test -f "app/src/main/AndroidManifest.xml" || {
            echo "Missing: app/src/main/AndroidManifest.xml"
            find app -maxdepth 4 -type f | sort
            exit 1
          }

          test -f "app/src/main/java/com/pearparinya/automovie/StudioActivity.kt" || {
            echo "Missing: StudioActivity.kt"
            find app/src/main -type f | sort
            exit 1
          }

          echo "DIRECTOR X project files verified."

      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName."
            exit 1
          fi
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [ -n "$VERSION_CODE" ] || { echo "Unable to read versionCode."; exit 1; }
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building DIRECTOR X R$VERSION_NAME • BUILD $VERSION_CODE"

      - name: Build release APK
        shell: bash
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease

      # ============================================================
      # LOCATE UNSIGNED APK
      # ============================================================

      - name: Locate unsigned release APK
        id: locate_apk
        shell: bash
        run: |
          UNSIGNED_APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*unsigned*.apk' \
            | head -n 1)"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "Found: $UNSIGNED_APK"
          echo "unsigned_apk=$UNSIGNED_APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SIGN WITH PERMANENT KEY
      # ============================================================

      - name: Sign release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UNSIGNED_APK: ${{ steps.locate_apk.outputs.unsigned_apk }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          SIGNED_APK="$RUNNER_TEMP/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/director-x-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          test -s "$SIGNED_APK" || {
            echo "Signed APK was not created."
            exit 1
          }

          echo "DIRECTOR X R${{ steps.app_version.outputs.version }} APK signed."

      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk"

          echo "DIRECTOR X R${{ steps.app_version.outputs.version }} signature verified."
          echo "### Signed APK SHA-256" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk" >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # VERIFY PACKAGE AND VERSION INSIDE THE SIGNED APK
      # ============================================================

      - name: Verify signed APK metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.app_version.outputs.version }}
          EXPECTED_BUILD: ${{ steps.app_version.outputs.build }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/DIRECTOR-X-${EXPECTED_VERSION}-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$AAPT" || { echo "::error::aapt is unavailable."; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package: ')"
          test -n "$PACKAGE_LINE" || { echo "::error::APK package metadata missing."; exit 1; }
          EXPECTED_PACKAGE="com.pearparinya.automovie"
          [[ "$PACKAGE_LINE" == *"name='$EXPECTED_PACKAGE'"* ]] || {
            echo "::error::Unexpected APK package name."
            exit 1
          }
          [[ "$PACKAGE_LINE" == *"versionCode='$EXPECTED_BUILD'"* ]] || {
            echo "::error::APK versionCode does not match Gradle configuration."
            exit 1
          }
          [[ "$PACKAGE_LINE" == *"versionName='$EXPECTED_VERSION'"* ]] || {
            echo "::error::APK versionName does not match Gradle configuration."
            exit 1
          }
          {
            echo "### Signed APK package metadata verified"
            echo "- Package: \`$EXPECTED_PACKAGE\`"
            echo "- Version: \`$EXPECTED_VERSION\`"
            echo "- Build: \`$EXPECTED_BUILD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTOR-X-${{ steps.app_version.outputs.version }}-SIGNED-APK
          path: ${{ runner.temp }}/DIRECTOR-X-${{ steps.app_version.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # PUBLISH IMMUTABLE BUILD RELEASE FOR IN-APP UPDATE
      # Each build gets its own tag/asset. This avoids stale asset IDs
      # from repeatedly replacing the R6.24 release asset.
      # ============================================================

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD="${{ steps.app_version.outputs.build }}"
          TAG="R${VERSION}-B${BUILD}"
          APK="$RUNNER_TEMP/DIRECTOR-X-${VERSION}-release.apk"
          ASSET_NAME="DIRECTOR-X-${VERSION}.apk"
          PUBLISH_APK="$RUNNER_TEMP/$ASSET_NAME"

          cp "$APK" "$PUBLISH_APK"

          # Refuse to overwrite an existing release or tag. Each build is immutable.
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release or tag $TAG already exists; increase the app version."
            exit 1
          fi

          gh release create "$TAG" "$PUBLISH_APK" \
            --target "${{ github.sha }}" \
            --title "DIRECTOR X ${VERSION}" \
            --notes "DIRECTOR X ${VERSION} — อัปเดตภายในแอปได้โดยตรง" \
            --latest

          echo "Verifying published build release..."
          ACTUAL_BODY="$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" --jq '.body')"
          ACTUAL_ASSET="$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name == "'"$ASSET_NAME"'") | .name' | head -n 1)"

          echo "$ACTUAL_BODY" | grep -q "DIRECTOR X ${VERSION}" || {
            echo "Release verification failed: BUILD metadata is not current."
            exit 1
          }

          [ "$ACTUAL_ASSET" = "$ASSET_NAME" ] || {
            echo "Release verification failed: APK asset is missing."
            exit 1
          }

          # Download the public release asset and verify that it matches the
          # locally signed APK byte-for-byte. This catches upload corruption.
          VERIFY_DIR="$(mktemp -d)"
          gh release download "$TAG" --pattern "$ASSET_NAME" --dir "$VERIFY_DIR"
          test -s "$VERIFY_DIR/$ASSET_NAME" || {
            echo "::error::Published APK is empty or missing."
            exit 1
          }
          cmp -s "$PUBLISH_APK" "$VERIFY_DIR/$ASSET_NAME" || {
            echo "::error::Published APK differs from the verified signed APK."
            exit 1
          }
          echo "### Published APK integrity verified: $TAG" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$VERIFY_DIR/$ASSET_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Published and verified $TAG • $ASSET_NAME."

