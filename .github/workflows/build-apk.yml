name: DIRECTOR X Legacy Release Workflow (disabled)

# Legacy R<version>-B<build> publishing conflicts with the canonical
# v<version>-build<build> release consumed by StudioUpdater.
# Kept as a manual diagnostic entry; never creates or marks a release latest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy APK publisher disabled. Use publish-signed-release.yml for signed releases."
