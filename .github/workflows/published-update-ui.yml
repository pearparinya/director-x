name: Published Android update verification
on:
  workflow_dispatch:
  push:
    branches: [qa/check-installed-633-to-634]
    paths: ['scripts/test_published_update_ui.py', '.github/workflows/published-update-ui.yml']
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact 6.33 APK delivered to mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45534199603 --repo "$GITHUB_REPOSITORY" --name director-x-signed-candidate --dir "$RUNNER_TEMP/dx633"
          cp "$RUNNER_TEMP/dx633/candidate.apk" /tmp/previous.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/test_published_update_ui.py
