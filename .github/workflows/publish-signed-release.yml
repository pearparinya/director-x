name: DIRECTOR X Publish Signed APK Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check_release_config.py'
      - '.github/workflows/publish-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: director-x-publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read version and reject an existing release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          BUILD="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION" && test -n "$BUILD"
          TAG="v${VERSION}-build${BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release configuration
        if: steps.version.outputs.exists == 'false'
        run: python3 scripts/check_release_config.py
      - name: Restore signing key
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Test and build release
        if: steps.version.outputs.exists == 'false'
        run: gradle :app:testDebugUnitTest :app:assembleRelease
      - name: Sign and verify release APK
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)"
          test -s "$UNSIGNED"
          APK="$RUNNER_TEMP/DIRECTOR-X-v${VERSION}-build${BUILD}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -m1 "^package: name='com.pearparinya.automovie' versionCode='$BUILD' versionName='$VERSION'"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" && sha256sum --check "$(basename "$APK").sha256")
      - name: Publish immutable GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/DIRECTOR-X-v${VERSION}-build${BUILD}.apk"
          test -s "$APK"
          gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "DIRECTOR X $VERSION Build $BUILD" --notes "Signed Android APK built from main at $GITHUB_SHA. Unit tests, package/version checks, APK signature verification and SHA-256 validation passed." --latest
