name: DIRECTOR X Automatic Signed Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check_release_config.py'
      - '.github/workflows/automatic-signed-candidate.yml'
      - '.github/workflows/auto-merge-verified.yml'
      - '.github/workflows/publish-signed-release.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release configuration
        run: python3 scripts/check_release_config.py
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Unit tests and release build
        run: gradle :app:testDebugUnitTest :app:assembleRelease
      - name: Sign and verify candidate
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)"
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/candidate.apk" "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/candidate.apk"
          (cd "$RUNNER_TEMP" && sha256sum candidate.apk > candidate.apk.sha256 && sha256sum --check candidate.apk.sha256)
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          BUILD="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/candidate.apk" | grep -m1 "^package: name='com.pearparinya.automovie' versionCode='$BUILD' versionName='$VERSION'"
      - uses: actions/upload-artifact@v4
        with:
          name: director-x-signed-candidate
          path: |
            ${{ runner.temp }}/candidate.apk
            ${{ runner.temp }}/candidate.apk.sha256
          retention-days: 7
      - name: Compare with the published 6.24 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          current="$RUNNER_TEMP/candidate.apk"
          if ! "$tools/aapt" dump badging "$current" | sed -n '1p' | grep -q "versionCode='1241'"; then exit 0; fi
          gh release download v6.24-build1240 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          previous="$(find "$RUNNER_TEMP/previous" -name '*.apk')"
          "$tools/aapt" dump badging "$previous" | sed -n '1p' | grep -F "name='com.pearparinya.automovie' versionCode='1240'"
          for apk in "$previous" "$current"; do
            "$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u > "$apk.cert"
            test -s "$apk.cert"
          done
          diff "$previous.cert" "$current.cert"
          cat "$current.cert"
          sha256sum "$current"
          echo "VERIFY_625_UPGRADE=true" >> "$GITHUB_ENV"
      - name: Prepare local upgrade instrumentation
        if: env.VERIFY_625_UPGRADE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebugAndroidTest
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test_apk="$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/upgrade-test.apk" "$test_apk"
      - name: Enable KVM for upgrade test
        if: env.VERIFY_625_UPGRADE == 'true'
        run: sudo chmod 666 /dev/kvm
      - name: Verify installation over 6.24 and retained project and MASTER files
        if: env.VERIFY_625_UPGRADE == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/verify_navigation_upgrade.sh
