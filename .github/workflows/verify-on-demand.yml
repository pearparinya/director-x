name: On-demand Android verification

# Run verification without consuming Codex tasks.
# This workflow does not publish, sign, or replace the production APK.
on:
  workflow_dispatch:
    inputs:
      build_debug_apk:
        description: "Also compile a debug APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Compile debug APK when requested
        if: ${{ inputs.build_debug_apk }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        if: ${{ inputs.build_debug_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: director-x-debug-verification
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
