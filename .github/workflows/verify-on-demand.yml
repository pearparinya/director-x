name: On-demand Android verification

# Run verification without consuming Codex tasks.
# This workflow does not publish, sign, or replace the production APK.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/verify-on-demand.yml'
      - '.github/workflows/build-apk.yml'
      - 'scripts/check_release_config.py'
  workflow_dispatch:
    inputs:
      build_debug_apk:
        description: "Also compile a debug APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check release configuration without publishing
        run: python3 scripts/check_release_config.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME" || { echo 'Android SDK missing on runner'; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
      - name: Install Gradle 8.9 with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Publish test report summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Director X Android verification"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch/ref: \`${GITHUB_REF_NAME}\`"
            echo "- Unit test report: see uploaded artifact (when generated)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile debug APK when requested
        if: ${{ inputs.build_debug_apk }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        if: ${{ inputs.build_debug_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: director-x-debug-verification
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
