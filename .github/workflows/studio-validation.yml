name: Studio validation
on:
  push:
    branches: [codex/director-x-120]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full Android instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            # Stabilize the test device before running the full suite.
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # Bound boot broadcast settling; Google background jobs need not become globally idle.
            timeout 60s adb shell am wait-for-broadcast-idle || echo "Broadcast settling exceeded 60 seconds"
            # Restart the launcher before instrumentation, not during a test.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
            mkdir -p app/build/emulator-diagnostics
            sh -c 'status=0; gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest || status=$?; adb logcat -d -t 4000 > app/build/emulator-diagnostics/logcat.txt || true; adb shell dumpsys activity activities > app/build/emulator-diagnostics/activities.txt || true; exit "$status"'
      - name: Capture emulator diagnostics
        if: failure()
        run: |
          echo "Instrumentation failed; inspect the uploaded test reports for foreground-window and clipboard failures."
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/emulator-diagnostics/**
          if-no-files-found: warn
